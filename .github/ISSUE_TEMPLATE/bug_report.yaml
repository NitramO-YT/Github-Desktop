name: 🐛 Bug Report
description: File a bug report about this Linux build
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the **Linux build** of GitHub Desktop published from this fork, not for GitHub Desktop itself.

        If the problem also happens on Windows or macOS, or has nothing to do with packaging, desktop integration or Linux itself, the upstream tracker at [desktop/desktop](https://github.com/desktop/desktop/issues) is where it gets fixed. Reporting it here is still fine when you are unsure: a wrong guess costs nothing, and pointing you to the right place is quick.
  - type: textarea
    id: the-problem
    attributes:
      label: The problem
      description:
        Describe the issue you are experiencing. Provide a clear and concise
        description of what you were trying to do and what happened, along with
        any error messages you encountered.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release version
      description:
        The version this build reports, such as 3.6.6-linux1. Open the 'About
        GitHub Desktop' menu item to see it.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which file did you install or run?
      options:
        - .deb
        - .rpm
        - AppImage
        - Flatpak
        - Built from source
        - Something else, described below
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution
      description:
        'Name and version of your distribution (example: Ubuntu 24.04, Fedora
        41, Arch)'
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Display server
      description:
        Wayland and X11 behave differently for window icons, screen sharing and
        scaling, so this often decides where a bug comes from. `echo
        $XDG_SESSION_TYPE` prints it.
      options:
        - Wayland
        - X11
        - Not sure
    validations:
      required: true
  - type: input
    id: desktop-environment
    attributes:
      label: Desktop environment
      description: 'Example: KDE Plasma 6, GNOME 47, XFCE'
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce the behavior
      description: Provide steps to reproduce the problem you are experiencing.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
  - type: textarea
    id: logs
    attributes:
      label: Log files
      description:
        Please upload a log file from a day you experienced the issue. The menu
        item `Help` > `Show Logs` opens the folder, which on Linux is
        `~/.config/GitHub Desktop/logs`, or
        `~/.var/app/io.github.nitramo_yt.Github-Desktop/config/GitHub
        Desktop/logs` for the Flatpak. If the application does not start at all,
        running it from a terminal and pasting what it prints is just as useful.
      placeholder:
        You can attach log files by clicking this area to highlight it and then
        dragging the files in.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots to help explain your problem, if applicable.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description:
        Add any other context about the problem you are experiencing here.
