name: ⭐ Feature Request
description: Submit a feature request about this Linux build
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a feature request! This tracker is for the **Linux build** of GitHub Desktop published from this fork, so it is the right place for what packaging and desktop integration decide: distribution formats, desktop entry and protocol handlers, terminal and editor detection, dependencies, architectures.

        Features of the application itself are decided upstream, at [desktop/desktop](https://github.com/desktop/desktop/issues): this fork follows their releases and does not change what the application does. For github.com, the [GitHub public feedback discussions repository](https://github.com/github/feedback/discussions) is the place.

        Please search this tracker first to see if there is an existing issue for the feature you are requesting.
  - type: textarea
    id: the-feature-request
    attributes:
      label: The feature request
      description:
        Write a clear and concise description of what the feature or problem is.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Share how this will benefit GitHub Desktop and its users.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description:
        Please include any other context, like screenshots or mockups, if
        applicable.
