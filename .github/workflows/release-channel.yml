name: 'Release channel'

# The Stable and Beta links in the README never change, so each one is a
# release of its own, tagged "stable" or "beta", holding a copy of the files and
# of the notes of the version it currently points at. This workflow moves one
# of those two pointers onto a version that has already been published.
#
# The files are copied, never rebuilt, so that what a channel serves is exactly
# what was tested under its version number.

on:
  workflow_dispatch:
    inputs:
      version:
        description:
          'Tag of the published version to point at, for instance
          release-3.6.6-linux1'
        required: true
        type: string
      channel:
        description: 'Channel to move onto that version'
        required: true
        type: choice
        options:
          - stable
          - beta
      minimum_age_days:
        description:
          'Refuse a version published more recently than this, in days. Stable
          only.'
        required: false
        default: '7'
        type: string
      force:
        description:
          'Promote to stable even if the version is younger than that'
        required: false
        default: false
        type: boolean

jobs:
  promote:
    name: Point ${{ inputs.channel }} at ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.move.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_TAG: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Check the version can go to this channel
        run: |
          release="$(gh release view "$SOURCE_TAG" --json isDraft,isPrerelease,publishedAt)"

          if [ "$(echo "$release" | jq -r '.isDraft')" = "true" ]; then
            echo "$SOURCE_TAG is still a draft. Publish it first." >&2
            exit 1
          fi

          case "$CHANNEL:$SOURCE_TAG" in
            stable:*beta*)
              echo "$SOURCE_TAG is a beta, so it cannot become the stable version." >&2
              exit 1
              ;;
            beta:*beta*) ;;
            beta:*)
              echo "$SOURCE_TAG is not a beta, so it does not belong to the beta channel." >&2
              exit 1
              ;;
          esac

          published_at="$(echo "$release" | jq -r '.publishedAt')"
          echo "PUBLISHED_AT=$published_at" >> "$GITHUB_ENV"

      # A version becomes stable once it has been in use for a while, so the
      # delay is checked here rather than left to memory. Beta has no such
      # delay: it exists to carry what is new.
      - name: Check the version is old enough for stable
        if: inputs.channel == 'stable' && !inputs.force
        run: |
          age_days=$(( ( $(date +%s) - $(date -d "$PUBLISHED_AT" +%s) ) / 86400 ))
          minimum="${{ inputs.minimum_age_days }}"

          if [ "$age_days" -lt "$minimum" ]; then
            echo "$SOURCE_TAG was published $age_days day(s) ago, and stable asks for $minimum." >&2
            echo "Run this workflow again with force if you mean to promote it anyway." >&2
            exit 1
          fi

          echo "$SOURCE_TAG was published $age_days day(s) ago."

      - name: Copy the files of that version
        run: |
          mkdir assets
          gh release download "$SOURCE_TAG" --dir assets

          # The Flatpak of a version subscribes whoever installs it to latest,
          # where every version comes out before stable. Offered on the stable
          # release, it would move them off stable without a word, so that
          # release names the stable branch of the repository instead.
          if [ "$CHANNEL" = "stable" ] && compgen -G 'assets/*.flatpak' > /dev/null; then
            rm assets/*.flatpak assets/*.flatpak.sha256
            echo "FLATPAK_REF=https://packages-github-desktop.nitramo.fr/flatpak/github-desktop-stable.flatpakref" >> "$GITHUB_ENV"
          fi
          ls -l assets

      - name: Move the channel onto that version
        id: move
        run: |
          # Releases are tagged with annotated tags, whose ref points at a tag
          # object rather than at a commit. Asking for the commit of the tag
          # resolves that in one step, where reading the ref hands over the tag
          # object and leaves the release creation to fail with a server error.
          commit="$(gh api "repos/$GH_REPO/commits/$SOURCE_TAG" --jq '.sha')"
          version="${SOURCE_TAG#release-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$CHANNEL" = "stable" ]; then
            title="Stable: GitHub Desktop for Linux $version"
            notes="This release always holds the current stable version, and its address never changes. It currently holds [$version](../../releases/tag/$SOURCE_TAG)."
            if [ -n "${FLATPAK_REF:-}" ]; then
              notes+=$'\n\n'"To follow the stable channel with Flatpak, install it from the package repository: \`flatpak install --user $FLATPAK_REF\`"
            fi
            extra=()
          else
            title="Beta: GitHub Desktop for Linux $version"
            notes="This release always holds the most recent beta, and its address never changes. It currently holds [$version](../../releases/tag/$SOURCE_TAG), built from an official beta."
            extra=(--prerelease)
          fi

          # The notes of the version follow below a rule, so that the release of
          # the channel says what it holds without a click through. They are
          # copied as they stand when this workflow runs: an edit made to them
          # later shows here once the workflow runs again. The blank line before
          # the rule matters, as a --- right under a paragraph turns that
          # paragraph into a heading.
          body="$(gh release view "$SOURCE_TAG" --json body --jq '.body')"
          {
            echo "$notes"
            if [ -n "$body" ]; then
              printf '\n---\n\n%s\n' "$body"
            fi
          } > notes.md

          # The tag goes first because it is the one step GitHub may refuse, and
          # a refusal here leaves the channel serving what it served before.
          # GitHub lets the workflow token tag a commit only while each of its
          # workflow files also exists, same path and same content, on some
          # branch. The versions/ branch that ci-linux.yml keeps on the commit
          # of each version is what still satisfies that days later, once the
          # workflows have moved on.
          if gh api "repos/$GH_REPO/git/ref/tags/$CHANNEL" > /dev/null 2>&1; then
            request=(--method PATCH "repos/$GH_REPO/git/refs/tags/$CHANNEL" -F force=true)
          else
            request=("repos/$GH_REPO/git/refs" -f "ref=refs/tags/$CHANNEL")
          fi

          if ! gh api "${request[@]}" -f "sha=$commit" > /dev/null; then
            echo "GitHub refused to place the $CHANNEL tag on $commit." >&2
            echo "The branch versions/$version is what allows it: create it on that commit from GitHub Desktop, then run this again." >&2
            exit 1
          fi

          # The release is recreated rather than edited, so that its files are
          # exactly those of the version it points at, with nothing left over
          # from the version before. It is created on the tag placed above.
          gh release delete "$CHANNEL" --yes || true

          gh release create "$CHANNEL" assets/* \
            --verify-tag \
            --title "$title" \
            --notes-file notes.md \
            --latest=false \
            "${extra[@]}"

          echo "The $CHANNEL channel now points at $version." >> "$GITHUB_STEP_SUMMARY"

  # The package repository follows the channels rather than the releases, so
  # that what apt and dnf offer is always what the Stable and Beta links serve.
  repository:
    name: Update the package repository
    needs: promote
    uses: ./.github/workflows/publish-repo.yml
    with:
      version: ${{ needs.promote.outputs.version }}
      channel: ${{ inputs.channel }}
    secrets: inherit
