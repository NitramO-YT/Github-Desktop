name: 'CI / Linux'

# A push of prose changes nothing this workflow could check, so it is left
# alone. Path filters are not evaluated for tags, which is what makes this
# safe: a release tag always builds, whatever it happens to touch.
on:
  push:
    branches:
      - linux
      - linux-beta
      - 'linux-release-*'
    tags:
      - 'release-*-linux*'
    paths-ignore: &prose
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - linux
      - linux-beta
      - 'linux-release-*'
    paths-ignore: *prose
  workflow_dispatch:

jobs:
  build:
    name: Ubuntu x64
    # Pinned rather than ubuntu-latest: the glibc of the machine that builds
    # sets the minimum glibc the packages ask of whoever installs them, so it
    # is a decision of this project rather than one to inherit from a label
    # that moves. 22.04 keeps Ubuntu 22.04 and Debian 12 users in.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # A build made from a beta tag, or from the branch that follows the
      # upstream betas, enables the same features as the official beta channel.
      RELEASE_CHANNEL:
        ${{ contains(github.ref_name, 'beta') && 'beta' || 'production' }}
      npm_config_arch: x64
      TARGET_ARCH: x64
      # Whether this run goes as far as building the three packages. See the
      # packaging step for why it is not always worth it.
      PACKAGING:
        ${{ startsWith(github.ref, 'refs/tags/') || github.event_name ==
        'workflow_dispatch' }}
      # Three native modules, printenvz, process-proxy and the trampoline,
      # compile with -Werror while redefining _FORTIFY_SOURCE, a macro the
      # compiler of Ubuntu 22.04 already defines on its own. The redefinition
      # warning then stops the install. Only a plain -Wno-error covers it: the
      # warning has no option of its own, so -Wno-error=cpp and
      # -Wno-builtin-macro-redefined both leave it an error. Flags coming from
      # the environment are placed after those of each binding.gyp, which is
      # what gives this one the last word.
      CFLAGS: -Wno-error
      CXXFLAGS: -Wno-error
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A tag names the version it publishes, so a mismatch would ship packages
      # whose file names disagree with the release they are attached to.
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#release-}"
          version="$(node -p "require('./app/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "The tag says $tag while app/package.json says $version." >&2
            exit 1
          fi

      # These come before installing the dependencies, since the keychain module
      # needs libsecret to load and its headers to build when no prebuilt binary
      # matches the runner. rpmbuild is what builds the .rpm further down.
      - name: Install the system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            rpm libsecret-1-0 libsecret-1-dev

      - name: Read the Node version this project asks for
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ steps.node.outputs.version }}
          arch: x64

      - name: Build production app
        run: yarn build:prod

      - name: Prepare testing environment
        run: yarn test:setup

      - name: Run unit tests
        run: yarn test:unit

      - name: Run script tests
        run: yarn test:script

      # Packaging is half the time of a run, and what it produces is only ever
      # used by a release: the packages of an ordinary push expire untouched
      # after five days. It therefore runs for a tag, and on request from the
      # Actions tab when the packages themselves are what needs trying out.
      # Everything above this line still runs on every push, since catching a
      # broken build or a failing test is the point of the exercise.
      - name: Package application
        if: env.PACKAGING == 'true'
        run: yarn package

      - name: Generate the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -r ts-node/register script/generate-release-notes.ts \
            "${{ github.workspace }}/dist" "${GITHUB_REF_NAME#release-}"

      - name: Upload the packages
        if: env.PACKAGING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          retention-days: 5
          if-no-files-found: error

      - name: Upload the release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: script/release_notes.txt
          retention-days: 5
          if-no-files-found: error

  # The Flatpak repackages the .deb built above, so it runs whenever the
  # packages are built. The build image Flathub maintains holds flatpak-builder
  # and the runtime the manifest names.
  flatpak:
    name: Flatpak x64
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/') || github.event_name ==
      'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      # flatpak-builder isolates each build step with bubblewrap, which needs
      # namespaces that an unprivileged container cannot create.
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-packages
          path: packages

      # The bundle subscribes whoever installs it to the package repository,
      # and Flatpak then accepts only content signed with the key of that
      # repository. This job runs flatpak-builder on the .deb and none of the
      # npm dependencies of the project, which is what makes it the place to
      # hand the key to.
      - name: Import the signing key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          echo "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "GPG_KEY=$key" >> "$GITHUB_ENV"
          echo "Signing with $key"

      - name: Build the Flatpak from the .deb
        run: |
          deb="$(ls packages/GitHubDesktop-linux-amd64-*.deb)"
          version="${deb#packages/GitHubDesktop-linux-amd64-}"
          version="${version%.deb}"
          bash script/build-flatpak.sh "$deb" "$version" flatpak "$GPG_KEY"

      - name: Upload the Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-flatpak
          path: flatpak/*
          retention-days: 5
          if-no-files-found: error

  publish:
    name: Create the GitHub release
    needs: [build, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-packages
          path: packages

      - name: Download the Flatpak
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-flatpak
          path: packages

      - name: Download the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      # The release is created as a draft: the packages are attached and the
      # release notes are filled in, but nothing is public until a human reads
      # them over and presses Publish. A beta is a pre-release, so that the
      # "Latest" badge, and the link that follows it, keep pointing at the most
      # recent stable-numbered build.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#release-}"
          flags=(--draft --title "GitHub Desktop for Linux $version")
          flags+=(--notes-file notes/release_notes.txt)

          case "$version" in
            *beta*) flags+=(--prerelease --latest=false) ;;
            *) flags+=(--latest) ;;
          esac

          gh release create "$GITHUB_REF_NAME" packages/* "${flags[@]}"

  # Moving the Stable or Beta link onto a version tags its commit, days after
  # the version came out. GitHub lets the workflow token do so only while each
  # workflow file of that commit also exists, same path and same content, on
  # some branch, and a single workflow edited in the meantime is enough for the
  # promotion to be refused. A branch kept on the commit of each version keeps
  # its workflow files on a branch for as long as a channel may move onto it.
  #
  # It is created as soon as the tag arrives, while the tagged commit still
  # holds the workflow files of the branch it was tagged on: that is the moment
  # the workflow token is allowed to create it.
  keep-version-branch:
    name: Keep the version on a branch
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Betas and the others are counted apart, since each kind feeds its own
      # channel. Three per kind lets a channel move back onto a recent version.
      KEEP: 3
    steps:
      - name: Create the branch on the tagged commit
        run: |
          branch="versions/${GITHUB_REF_NAME#release-}"
          # The commit itself, rather than the annotated tag object the tag
          # points at, which a branch cannot point at.
          commit="$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq '.sha')"

          if existing="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2> /dev/null)"; then
            if [ "$existing" != "$commit" ]; then
              echo "$branch already exists, on $existing rather than on $commit." >&2
              exit 1
            fi
            echo "$branch is already on $commit."
          elif gh api "repos/$GH_REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$commit" > /dev/null; then
            echo "Created $branch on $commit."
          else
            echo "GitHub refused to create $branch on $commit: a workflow file has most likely changed on every branch since the tag was pushed." >&2
            echo "Create it from GitHub Desktop on that commit, or no channel will be able to move onto this version." >&2
            exit 1
          fi

      - name: Drop the branches of older versions
        run: |
          version="${GITHUB_REF_NAME#release-}"

          gh api --paginate "repos/$GH_REPO/git/matching-refs/heads/versions/" \
            --jq '.[].ref | ltrimstr("refs/heads/versions/")' > branches.txt

          case "$version" in
            *beta*) grep 'beta' branches.txt > same-kind.txt || true ;;
            *) grep -v 'beta' branches.txt > same-kind.txt || true ;;
          esac
          sort --version-sort --reverse same-kind.txt | tail -n "+$((KEEP + 1))" > older.txt

          while read -r old; do
            if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/versions/$old" > /dev/null; then
              echo "Deleted versions/$old."
            else
              echo "::warning::Could not delete versions/$old."
            fi
          done < older.txt
