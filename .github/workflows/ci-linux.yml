name: 'CI / Linux'

on:
  push:
    branches:
      - linux
      - linux-beta
      - 'linux-release-*'
    tags:
      - 'release-*-linux*'
  pull_request:
    branches:
      - linux
      - linux-beta
      - 'linux-release-*'
  workflow_dispatch:

jobs:
  build:
    name: Ubuntu x64
    # Pinned rather than ubuntu-latest: the glibc of the machine that builds
    # sets the minimum glibc the packages ask of whoever installs them, so it
    # is a decision of this project rather than one to inherit from a label
    # that moves. 22.04 keeps Ubuntu 22.04 and Debian 12 users in.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # A build made from a beta tag, or from the branch that follows the
      # upstream betas, enables the same features as the official beta channel.
      RELEASE_CHANNEL:
        ${{ contains(github.ref_name, 'beta') && 'beta' || 'production' }}
      npm_config_arch: x64
      TARGET_ARCH: x64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A tag names the version it publishes, so a mismatch would ship packages
      # whose file names disagree with the release they are attached to.
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#release-}"
          version="$(node -p "require('./app/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "The tag says $tag while app/package.json says $version." >&2
            exit 1
          fi

      - name: Read the Node version this project asks for
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ steps.node.outputs.version }}
          arch: x64

      # rpmbuild builds the .rpm, and libsecret is what the keychain module
      # loads at runtime. Neither is part of the runner image, and a missing
      # libsecret takes down every test that reaches an application store.
      - name: Install the packaging and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm libsecret-1-0

      - name: Build production app
        run: yarn build:prod

      - name: Prepare testing environment
        run: yarn test:setup

      - name: Run unit tests
        run: yarn test:unit

      - name: Run script tests
        run: yarn test:script

      - name: Package application
        run: yarn package

      - name: Generate the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -r ts-node/register script/generate-release-notes.ts \
            "${{ github.workspace }}/dist" "${GITHUB_REF_NAME#release-}"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          retention-days: 5
          if-no-files-found: error

      - name: Upload the release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: script/release_notes.txt
          retention-days: 5
          if-no-files-found: error

  publish:
    name: Create the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-packages
          path: packages

      - name: Download the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      # The release is created as a draft: the packages are attached and the
      # release notes are filled in, but nothing is public until a human reads
      # them over and presses Publish. A beta is a pre-release, so that the
      # "Latest" badge, and the link that follows it, keep pointing at the most
      # recent stable-numbered build.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#release-}"
          flags=(--draft --title "GitHub Desktop for Linux $version")
          flags+=(--notes-file notes/release_notes.txt)

          case "$version" in
            *beta*) flags+=(--prerelease --latest=false) ;;
            *) flags+=(--latest) ;;
          esac

          gh release create "$GITHUB_REF_NAME" packages/* "${flags[@]}"
