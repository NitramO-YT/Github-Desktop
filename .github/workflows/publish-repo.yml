name: 'Publish the package repository'

# Rebuilds packages-github-desktop.nitramo.fr from the versions each channel
# currently holds, so that users upgrade with apt or dnf instead of downloading
# a file by hand.
#
# The three channels carry the same meaning as the three download links in the
# README, and are fed the same way: latest fills itself when a release is
# published, stable and beta when their pointer is moved. An apt user therefore
# waits exactly as long as someone downloading by hand from the same link.

on:
  workflow_call:
    inputs:
      version:
        description:
          'Version the channel now holds, without the release- prefix'
        required: true
        type: string
      channel:
        description: 'Channel that moved'
        required: true
        type: string
  # A release becomes the newest one the moment it is published, the way the
  # Latest link on the releases page does, without waiting to be promoted.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description:
          'Version to put at the head of the channel, for instance 3.6.6-linux1'
        required: true
        type: string
      channel:
        description: 'Channel to update'
        required: true
        type: choice
        options:
          - stable
          - latest
          - beta

env:
  BUCKET: packages-github-desktop
  # How many versions of each channel stay downloadable. Enough to step back
  # from a regression without the bucket growing without end.
  KEEP: 3

jobs:
  publish:
    name: Publish to the package repository
    # Moving a channel creates a release too, tagged stable or beta, and
    # publishing it would otherwise send the channel round again. Only the
    # release- tags name a version, so they are the ones worth reacting to.
    if: >-
      github.event_name != 'release' || (github.event.release.prerelease ==
      false && startsWith(github.event.release.tag_name, 'release-'))
    # Each run reads state.json, rebuilds the repository from it and writes it
    # back, so two runs at the same time would each write a state missing the
    # channel the other one moved, and nothing would say so. Runs therefore go
    # one at a time, in the order they arrive. Without a queue GitHub keeps a
    # single run waiting and cancels it when a third one comes. Declared on the
    # job rather than on the workflow, so that it also holds when a promotion
    # calls this workflow.
    concurrency:
      group: package-repository
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
      # R2 is S3-compatible but has no regions; the CLI still insists on one.
      AWS_DEFAULT_REGION: auto
      # Recent AWS CLI releases add a streaming CRC checksum that R2 rejects.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - uses: actions/checkout@v7

      # Several steps below, and the page renderer, are written in JavaScript.
      # Pinning the version the project already asks for keeps them from
      # depending on whatever the runner image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # A published release names its own version and belongs to the newest
      # channel by definition; a manual run says which version goes where.
      - name: Work out what is being published, and where
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag='${{ github.event.release.tag_name }}'
            echo "VERSION=${tag#release-}" >> "$GITHUB_ENV"
            echo "CHANNEL=latest" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
            echo "CHANNEL=${{ inputs.channel }}" >> "$GITHUB_ENV"
          fi

      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apt-utils createrepo-c rpm

      # The bucket holds what each channel currently serves. Reading it back is
      # what lets a run add one version and drop the oldest without having to
      # work out, from the releases alone, which ones were ever promoted.
      - name: Read what each channel holds today
        run: |
          aws s3 cp "s3://$BUCKET/state.json" state.json --endpoint-url "$AWS_ENDPOINT_URL" \
            || echo '{"stable": [], "latest": [], "beta": []}' > state.json
          cat state.json

      - name: Work out the versions to publish
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs"

            const state = JSON.parse(readFileSync("state.json", "utf8"))
            const { CHANNEL, VERSION, KEEP } = process.env

            const previous = state[CHANNEL] ?? []
            const updated = [VERSION, ...previous.filter(v => v !== VERSION)]
              .slice(0, Number(KEEP))

            state[CHANNEL] = updated
            for (const channel of ["stable", "latest", "beta"]) state[channel] ??= []

            writeFileSync("state.json", JSON.stringify(state, null, 2) + "\n")
            writeFileSync("versions.txt", updated.join("\n") + "\n")
          '
          echo "The $CHANNEL channel will serve:"
          sed 's/^/  /' versions.txt

      # Besides the packages, each version brings its checksum files and the
      # list of its files with their size: the landing page shows both, the
      # AppImage included, although only the packages are served from here.
      - name: Collect the packages of those versions
        run: |
          mkdir -p staging/deb/stable staging/deb/latest staging/deb/beta \
                   staging/rpm/stable staging/rpm/latest staging/rpm/beta \
                   staging/checksums staging/assets

          for channel in stable latest beta; do
            # The trailing newline matters: read drops a last line that has
            # none, which silently downloads nothing at all.
            node -e '
              const state = require("./state.json")
              const versions = state[process.argv[1]] ?? []
              process.stdout.write(versions.map(v => v + "\n").join(""))
            ' "$channel" > list.txt

            while read -r version; do
              [ -n "$version" ] || continue
              echo "Downloading $version for $channel"
              gh release download "release-$version" \
                --pattern '*.deb' --dir "staging/deb/$channel" --clobber
              gh release download "release-$version" \
                --pattern '*.rpm' --dir "staging/rpm/$channel" --clobber
              gh release download "release-$version" \
                --pattern '*.sha256' --dir staging/checksums --clobber
              gh release view "release-$version" --json assets \
                --jq '[.assets[] | {name, size}]' > "staging/assets/$version.json"
            done < list.txt
          done

          find staging -name '*.deb' -o -name '*.rpm' | sort

      # Everything downstream reads the staging directory and would otherwise
      # fail several steps later, on a path that does not exist, saying nothing
      # about the version that never arrived.
      - name: Check every version listed was collected
        run: |
          node -e '
            const { readdirSync, existsSync } = require("node:fs")
            const state = require("./state.json")
            let missing = 0

            for (const channel of ["stable", "latest", "beta"]) {
              for (const version of state[channel] ?? []) {
                for (const [kind, ext] of [["deb", ".deb"], ["rpm", ".rpm"]]) {
                  const dir = `staging/${kind}/${channel}`
                  const found = existsSync(dir)
                    && readdirSync(dir).some(f => f.endsWith(ext) && f.includes(version))
                  if (!found) {
                    console.error(`Missing the ${ext} of ${version} for ${channel}`)
                    missing++
                  }
                }
              }
            }

            if (missing > 0) process.exit(1)
            console.log("Every listed version has its packages.")
          '

      # The repository serves copies of the release packages. One that differs
      # from the file its release published, damaged on the way or replaced,
      # stops the publication here instead of being signed into an index.
      - name: Check the packages are the files that were released
        run: |
          for package in staging/deb/*/*.deb staging/rpm/*/*.rpm; do
            [ -e "$package" ] || continue
            checksum="$GITHUB_WORKSPACE/staging/checksums/$(basename "$package").sha256"
            (cd "$(dirname "$package")" && sha256sum --check --quiet "$checksum")
          done
          echo "Every package matches the checksum published with its release."

      - name: Import the signing key
        run: |
          echo "${{ secrets.REPO_GPG_PRIVATE_KEY }}" | gpg --batch --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "GPG_KEY=$key" >> "$GITHUB_ENV"
          echo "Signing with $key"

      - name: Build the repository
        run: |
          # The landing page names the version each channel serves, so the
          # state travels with the packages it describes.
          cp state.json staging/state.json
          bash script/build-linux-repo.sh staging repo "$GPG_KEY"
          cp state.json repo/state.json

      # Packages first, indexes second. An index that names a package the bucket
      # does not hold yet breaks every apt update made in between, where a
      # package no index mentions yet is simply unused.
      - name: Upload the packages
        run: |
          aws s3 sync repo/deb/pool "s3://$BUCKET/deb/pool" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --cache-control 'public, max-age=31536000, immutable' \
            --size-only
          aws s3 sync repo/rpm "s3://$BUCKET/rpm" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --exclude '*/repodata/*' \
            --cache-control 'public, max-age=31536000, immutable' \
            --size-only

      - name: Upload the indexes
        run: |
          aws s3 sync repo/deb/dists "s3://$BUCKET/deb/dists" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --cache-control 'public, max-age=300' \
            --delete
          aws s3 sync repo/rpm "s3://$BUCKET/rpm" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --cache-control 'public, max-age=300' \
            --exclude '*' --include '*/repodata/*' --include '*.repo'

      # Last, so that a run that fails halfway leaves the bucket serving the
      # versions it was serving before, and the next run starts from there.
      - name: Drop the versions that left the channels, then record the state
        run: |
          aws s3 sync repo/deb/pool "s3://$BUCKET/deb/pool" \
            --endpoint-url "$AWS_ENDPOINT_URL" --delete --size-only

          # Everything sitting at the root of the tree, named or not: listing
          # the files one by one is how the icons ended up built but never
          # uploaded. The pattern excludes any path holding a slash, so the
          # channels above are left exactly as they were just written.
          aws s3 sync repo "s3://$BUCKET" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --exclude '*/*' \
            --cache-control 'public, max-age=300'

          aws s3 cp repo/index.html "s3://$BUCKET/index.html" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public, max-age=300'
          aws s3 cp repo/gpg.key "s3://$BUCKET/gpg.key" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --content-type 'text/plain; charset=utf-8' \
            --cache-control 'public, max-age=300'
          aws s3 cp repo/state.json "s3://$BUCKET/state.json" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --cache-control 'no-store'

      - name: Say what the repository now serves
        run: |
          {
            echo "### Package repository updated"
            echo
            echo "The **$CHANNEL** channel now serves:"
            echo
            sed 's/^/- /' versions.txt
            echo
            echo "<https://packages-github-desktop.nitramo.fr/>"
          } >> "$GITHUB_STEP_SUMMARY"
